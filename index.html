<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nature Explorer</title>
    <link rel="icon" type="image/png" href="./Chaitu.png"/>
    <link rel="stylesheet" href="./style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>Nature Explorer</h1>
    <form id="formOfTheNature">
      <input
        type="text"
        id="userInput"
        placeholder="Search for nature images..."
        autocomplete="off"
      />
      <button>Search</button>
    </form>
    <div id="searchResult"></div>
    <button id="moreImgs">Show More</button>
        <div class="watermark">
            <p>Powered by Unsplash API</p>
            <p>Developed by @Chaitanya</p>
        </div>
    <script src="./script.js"></script>
  </body>
</html>
